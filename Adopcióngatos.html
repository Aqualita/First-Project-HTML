<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatos</title>
</head>

<body>
    <main>
        <section> <!-- La etiqueta <section> hace que el contenido esté bien estructurado -->
            <h1>CatPhotoApp</h1>
            <h2>Cat photos+</h2>
            <!-- El targer="_blank" hace que el enlace se abra en una nueva pestaña -->
            <p>todos aman <a href="https://adoptamiu.org/" target="_blank">los gatos lindos </a>online</p>
            <p> see more <a href="https://adoptamiu.org/" target="_blank">gatos</a> in our galerry</p>
            <a href="https://adoptamiu.org/" target="_blank"><img src="Imagenes/gatito.webp" alt="Gatito"></a>
        </section>
        <section>
            <h2>Comida de gatos</h2>
            <h3>Lo que más aman los gatos</h3>
            <ul> <!-- ul es una lista no ordenada -->
                <li>lasagna</li> <!-- li es un elemento de la lista -->
                <figure><!-- figure es un contenedor para ilustraciones -->
                    <a href="https://www.recetasdesbieta.com/lasagna-original/" target="_blank"><img
                            src="imagenes/Lasagna.webp" alt="lasagna" /></a>
                    <figcaption>Lasagna <em>favorita de los gatos</em></figcaption><!-- figcaption describe la imagen-->
                </figure><!-- el elemento <em> enfatiza el texto -->
                <li>catnip</li>
                <figure>
                    <a href="https://www.tiendanimal.es/articulos/catnip-la-menta-gatuna/" target="_blank"><img
                            src="imagenes/catnip.jpg" alt="catnip"></a>
                    <figcaption>catnip</figcaption>
                </figure>
                <li>Atún</li>
                <a href="https://www.plazavea.com.pe/abarrotes/conservas/pescados-en-conserva" target="_blank"><img
                        src="imagenes/Atun.avif" alt="atun"></a>
            </ul>
        </section>
    </main>
</body>
</html>
